# Copy to bench.toml. Local files may include machine-specific binary paths;
# bench.toml is ignored by Git.

mode = "local"
run_root = "runs"
seed_root = "Repo"
reference_root = "Repo/reference"
reference_manifest = "benchmarks/reference-pack.json"
timeout_s = 14400
full_access = false
repetitions = 1

# `enabled` selects the implementation fleet. Evaluators may use any known
# harness definition, including one disabled for implementation.

[harnesses.codex]
adapter = "codex"
model = "gpt-5.6-sol"
effort = "high"
provider_family = "openai"
display_name = "GPT-5.6 Sol"
enabled = true

# Optional Astra implementation harness using the authenticated Codex CLI.
# Select with --harness codex-astra after uncommenting this block.
# [harnesses.codex-astra]
# adapter = "codex"
# model = "gpt-6-astra"
# effort = "high"
# provider_family = "openai"
# display_name = "GPT-6 Astra"
# enabled = true
#
# Source: https://developers.openai.com/api/docs/models/gpt-6-astra
# [pricing."gpt-6-astra"]
# input = 10.0
# output = 50.0
# cache_read = 1.0
# cache_write = 12.5

# Optional GPT-6 Sol and GPT-6 Luna implementation harnesses using the
# authenticated Codex CLI. Select with --harness sol6 or --harness luna6 after
# uncommenting these blocks. Rates are standard short-context rates per 1M
# tokens; inputs above 272K use the long-context tier.
# [harnesses.sol6]
# adapter = "codex"
# model = "gpt-6-sol"
# effort = "high"
# provider_family = "openai"
# display_name = "GPT-6 Sol (High)"
# enabled = true
#
# Source: https://developers.openai.com/api/docs/pricing
# [pricing."gpt-6-sol"]
# input = 2.0
# output = 10.0
# cache_read = 0.2
# cache_write = 2.5
#
# [harnesses.luna6]
# adapter = "codex"
# model = "gpt-6-luna"
# effort = "max"
# provider_family = "openai"
# display_name = "GPT-6 Luna (Max)"
# enabled = true
#
# Source: https://developers.openai.com/api/docs/pricing
# [pricing."gpt-6-luna"]
# input = 0.1
# output = 0.5
# cache_read = 0.01
# cache_write = 0.125

[harnesses.claude]
adapter = "claude"
model = "claude-fable-5"
effort = "high"
provider_family = "anthropic"
display_name = "Claude Fable 5"
enabled = true

# Optional Claude Opus 5.5 implementation harness.
# Select with --harness claude-opus-55 after enabling this block.
# [harnesses.claude-opus-55]
# adapter = "claude"
# model = "claude-opus-5-5"
# effort = "high"
# provider_family = "anthropic"
# display_name = "Claude Opus 5.5 (High)"
# enabled = true
#
# [pricing."claude-opus-5-5"]
# input = 4.0
# output = 20.0
# cache_read = 0.2
# cache_write = 5.0

# Optional Claude Sonnet 5.5 implementation harness.
# Select with --harness claude-sonnet-55 after enabling this block.
# [harnesses.claude-sonnet-55]
# adapter = "claude"
# model = "claude-sonnet-5-5"
# effort = "high"
# provider_family = "anthropic"
# display_name = "Claude Sonnet 5.5 (High)"
# enabled = true
#
# [pricing."claude-sonnet-5-5"]
# input = 2.0
# output = 10.0
# cache_read = 0.2
# cache_write = 2.5

[harnesses.grok]
adapter = "grok"
model = "grok-4.5"
effort = "high"
provider_family = "xai"
display_name = "Grok 4.5"
enabled = true
# binary = "/absolute/path/to/the/intended/grok"

# Optional Grok 4.7 implementation harness. Select with --harness grok47 after
# uncommenting this block. The Grok CLI reports session cost directly.
# [harnesses.grok47]
# adapter = "grok"
# model = "grok-4.7"
# effort = "high"
# provider_family = "xai"
# display_name = "Grok 4.7 (High)"
# enabled = true

# Optional OpenCode harness for the Ox Alpha preview model. The benchmark alias
# `0x-alpha` maps to OpenCode's native `opencode/x-preview-f-free` ID, and this
# model currently requires the `max` variant. The alias `muse-spark-1.3` maps to
# the free `opencode/muse-spark-1.3-contributor-free` model at any effort from
# `minimal` to `xhigh`.
#
# [harnesses.opencode-alpha]
# adapter = "opencode"
# model = "0x-alpha"
# effort = "max"
# provider_family = "opencode"
# display_name = "0x Alpha (Max) via OpenCode"
# binary = "/absolute/path/to/the/intended/opencode"
# enabled = true
#
# [pricing."0x-alpha"]
# input = 0.0
# output = 0.0
# cache_read = 0.0
# cache_write = 0.0

# Optional Pi/OpenRouter harness for GLM 5.2. Set OPENROUTER_API_KEY before use.
# Pi relies on the isolated per-job folder in local mode. The optional container
# recipe adds an OS boundary; publication mode requires external isolation.
#
# [harnesses.pi-glm]
# adapter = "pi"
# model = "glm-5.2"
# effort = "high"
# provider_family = "zai"
# display_name = "GLM 5.2 via OpenRouter"
# enabled = true

# Optional Google Antigravity harness. Install and authenticate `agy`; the
# adapter supports Gemini 3.1 Pro at low/high effort and Gemini 3.5, 3.7, and
# 3.8 Flash at low/medium/high effort, and enables Antigravity's native
# terminal sandbox.
#
# [harnesses.agy-flash]
# adapter = "agy"
# model = "gemini-3.5-flash"
# effort = "high"
# provider_family = "google"
# display_name = "Gemini 3.5 Flash (High) via Antigravity"
# enabled = true

[[evaluators]]
# Sol 5.6 is intentional. Trials with Fable 5, Grok 4.5, and Sol 5.6 produced
# comparably fair judgments; Sol was the most detailed and thorough. Another
# evaluator may reduce cost while affecting detail more than general direction;
# record that choice explicitly in the run provenance.
id = "eval-sol"
harness = "codex"
model = "gpt-5.6-sol"
effort = "high"
provider_family = "openai"
enabled = true

# The September 23 to 29 runs used GPT-6 Sol at high effort as the evaluator.
# To reproduce them, uncomment the sol6 harness above and replace the
# evaluator block with this one.
#
# [[evaluators]]
# id = "eval-sol6-high"
# harness = "sol6"
# model = "gpt-6-sol"
# effort = "high"
# provider_family = "openai"
# enabled = true

# Publication mode requires at least two valid evaluator model IDs and three
# implementation repetitions. Configure the second
# evaluator explicitly before switching mode to "publication".
#
# [[evaluators]]
# id = "eval-fable"
# harness = "claude"
# model = "claude-fable-5"
# effort = "high"
# provider_family = "anthropic"
# enabled = true

[tracks.fe]
prompt = "benchmarks/fe/prompt.md"
rubric = "benchmarks/fe/eval.md"
contract = "benchmarks/fe/contract.json"

[tracks.be]
prompt = "benchmarks/be/prompt.md"
rubric = "benchmarks/be/eval.md"
contract = "benchmarks/be/contract.json"

# Exact USD rates per million tokens. Overrides take precedence over the
# cached models.dev snapshot. Model IDs must be safe lowercase identifiers.
#
# [pricing."gpt-5.6-sol"]
# input = 5.0
# output = 30.0
# cache_read = 0.5
# cache_write = 6.25
