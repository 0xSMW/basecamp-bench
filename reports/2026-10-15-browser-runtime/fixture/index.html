<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Read-only evaluator server check</title><style>body{font:18px system-ui;max-width:720px;margin:40px auto;padding:24px;box-sizing:border-box}input{display:block;box-sizing:border-box;width:100%;padding:12px;margin:12px 0}button{font:inherit;padding:12px 20px}p{overflow-wrap:anywhere}</style></head><body><h1>Read-only evaluator server check</h1><label for="note">Test note</label><input id="note" autocomplete="off"><button id="save">Save note</button><p id="count"></p><p id="status" role="status"></p><script>let state=JSON.parse(localStorage.getItem('basecamp-server-fixture')||'{"count":0,"note":""}');function render(){document.querySelector('#count').textContent='Saved notes: '+state.count;document.querySelector('#status').textContent=state.note?'Saved: '+state.note:'No note saved'}document.querySelector('#save').addEventListener('click',()=>{state={count:state.count+1,note:document.querySelector('#note').value};localStorage.setItem('basecamp-server-fixture',JSON.stringify(state));render()});render();</script></body></html>
